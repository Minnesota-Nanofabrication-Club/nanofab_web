# ====================================================================
# Publishes the site to GitHub Pages automatically.
#
# Every time you push to the "main" branch, GitHub runs Hugo for you
# and puts the finished site online. You never run `hugo` yourself.
#
# To turn this on, go to your repo on github.com:
#   Settings -> Pages -> "Build and deployment" -> Source: GitHub Actions
#
# See section 5 of README.md for the full walkthrough.
# ====================================================================
name: Deploy site to GitHub Pages

on:
  # Rebuild and republish on every push to main.
  push:
    branches: [main]
  # Also lets you trigger it by hand from the Actions tab.
  workflow_dispatch:

# Permissions the job needs in order to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer build finish rather than
# cancelling it — but don't run two deploys at the same time.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep this matching the Hugo version you use locally.
      # Check yours with: hugo version
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo
        run: |
          wget -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        env:
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
