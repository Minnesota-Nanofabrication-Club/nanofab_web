# ===================================================================
# ADVISORS — shown in the "Support" section on the homepage.
#
# TO ADD an advisor:    copy a whole "- name:" block and edit it.
# TO REMOVE an advisor: delete their block (or put a # in front of
#                       every one of its lines to hide them for now).
# TO REORDER:           move blocks up or down. They appear in the
#                       order they’re listed here.
#
# The section lays itself out automatically: 1-2 advisors get wide
# cards, 3 or more wrap into a grid. Add as many as you need.
#
# FIELDS
#   name   required — the person’s name
#   role   required — title and department, one line
#   bio    optional — two or three sentences on what they work on and
#                     how they help the club. Keep it short; it’s a
#                     bio, not a CV. Leave "" and the card just shows
#                     their name and role.
#   link   optional — their faculty page. Leave "" to hide it.
#                     The button reads "Faculty page", or "LinkedIn
#                     page" automatically when the link is to
#                     linkedin.com.
#   linkLabel optional — different text for that button, e.g.
#                     "Lab website". Leave it out to use the default.
#   photo  optional — leave "" and the card shows their initials,
#                     which looks intentional rather than broken.
#   photoPosition optional — which part of the photo to keep when
#                     it's trimmed to fit the frame: "X% Y%", where
#                     X is left→right and Y is top→bottom. Default
#                     "center 15%". Use it when a face looks off-centre
#                     or cut off. See README 4.9.
#
# PHOTOS go in static/images/advisors/. Any size works — they’re
# cropped to a square automatically, centred on the middle of the
# image. Roughly square headshots look best; a very wide photo will
# lose its edges.
# ===================================================================

