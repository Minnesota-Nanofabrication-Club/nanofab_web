# ==================================================================
# HOW THE FAB IS ORGANIZED
#
# The building has two build generations running side by side:
#   Gen 1 — the first working line, being built now
#   Gen 2 — the follow-on line, more capable, built after Gen 1
#
# Facility sits outside that split because it serves both lines.
# Application belongs to Gen 2 only (see the bottom of this file).
# (Research is commented out below.)
#
# STRUCTURE
#   Each block below is an AREA (a section heading on the site).
#   Inside it, "tracks" are the Gen 1 / Gen 2 columns. An area with
#   one track renders as a single column; two tracks render side by
#   side, Gen 1 on the left.
#
#   Every machine page in content/machines/ sets "category:" to a
#   TRACK NAME below, spelled exactly.
#
# "order" controls the sequence areas appear in, and is the number
# shown next to the heading. Areas appear in this order everywhere
# on the site.
#
# TO ADD AN AREA:    copy a block, give it an unused "order".
# TO ADD A MACHINE:  run `hugo new machines/name.md` and set its
#                    "category:" to one of the track names below.
# ==================================================================

# - name: Research
#   order: 1
#   slug: research
#   description: >-
#     The open question the lab exists to chase. Everything else is
#     infrastructure for running this experiment.
#   tracks:
#     - name: Research
#       gen: ""

- name: Facility
  order: 1
  slug: facility
  description: >-
    Wafer handling and clean air for both generations.
  tracks:
    - name: Facility
      gen: ""

- name: Patterning
  order: 2
  slug: patterning
  description: >-
    Printing and etching the pattern into the wafer.
  tracks:
    - name: Gen 1 Patterning
      gen: "Gen 1"
    - name: Gen 2 Patterning
      gen: "Gen 2"

- name: Doping
  order: 3
  slug: doping
  description: >-
    Adding impurities to set the silicon's electrical behavior.
  tracks:
    - name: Gen 1 Doping
      gen: "Gen 1"
    - name: Gen 2 Doping
      gen: "Gen 2"

- name: Thin Film Deposition
  order: 4
  slug: deposition
  description: >-
    Depositing metal and insulating layers.
  tracks:
    - name: Gen 1 Thin Film Deposition
      gen: "Gen 1"
    - name: Gen 2 Thin Film Deposition
      gen: "Gen 2"

- name: Wafer Inspection & Metrology
  order: 5
  slug: metrology
  description: >-
    Measuring and testing what we made.
  tracks:
    - name: Gen 1 Wafer Inspection & Metrology
      gen: "Gen 1"
    - name: Gen 2 Wafer Inspection & Metrology
      gen: "Gen 2"

# Application is Gen 2 only: the device the finished line builds
# toward. It has a single track, so it shows up in the Gen 2 band and
# not in Gen 1. It sits last because it's what the process steps
# above add up to.
- name: Application
  order: 6
  slug: application
  description: >-
    The device the process builds toward.
  tracks:
    - name: Application
      gen: "Gen 2"
