# ===================================================================
# OFFICERS — the club’s leadership, shown in the "Who runs the club"
# section on the homepage.
#
# TO ADD an officer:     copy a whole "- name:" block and edit it.
# TO REMOVE an officer:  delete their block.
# TO REORDER:            move blocks up or down. They appear in the
#                        order listed here, so keep President first.
#
# Fields:
#   name   required — the person’s name
#   role   required — their position, e.g. "President"
#   major  optional — degree program and/or year. Leave "" to hide.
#   email  optional — makes their name clickable. Leave "" to hide.
#   photo  optional — leave "" and their card shows their initials
#                     instead, which looks intentional rather than
#                     broken. Photos go in static/images/officers/
#                     (see README section 4.11). Name files in
#                     lowercase with hyphens and no spaces.
#   photoPosition
#          optional — only needed if a photo crops badly. Officer
#                     photos are circles, framed above centre so
#                     heads aren't cut off. Use "center top" if hair
#                     is still clipped, or "center 40%" if the face
#                     sits low in the frame.
#
# At the start of each school year, update this file — it’s the part
# that goes stale fastest.
# ===================================================================

