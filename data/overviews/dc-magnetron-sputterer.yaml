title: "DC Magnetron Sputtering System"

intro: |
  Sputtering uses electric fields to knock atoms off a target material
  and deposit them onto a substrate as a thin film. The goal of this
  machine is to sputter **aluminum metallization layers** and **bulk
  dielectric oxides**, with the build finished by Winter Break 2026.
  Start with this [video playlist on sputtering](https://www.youtube.com/playlist?list=PLa3ICAr3RGVUk5borkggWceW8nxZpXyIc).

