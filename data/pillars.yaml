# The three focus areas shown under "What we do."

- title: Process engineering
  description: Running the actual wafer-level steps — patterning, doping, thin-film deposition — on equipment we operate ourselves.

- title: Equipment builds
  description: Every machine in the fab is sourced, built, calibrated, and maintained by the team, not bought as a turnkey system.

- title: Documentation
  description: Build logs and process notes for every machine, so the lab stays repeatable and easy to hand off between members.
