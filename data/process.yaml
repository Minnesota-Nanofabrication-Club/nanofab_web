# ==================================================================
# THE PROCESS FLOW — the draggable flowchart at the top of /machines/.
#
# One entry per step, in the order a wafer goes through the line.
#
#   name      short step name shown on the card
#   text      one or two plain sentences: what happens to the wafer
#   details   a little more, shown when a visitor hovers over the card
#             (or focuses it); two or three sentences at most
#   photo     optional: a photo of a real wafer after this step, e.g.
#             "images/process/our-oxide.jpg" (put it in static/). Until
#             then the card shows the drawn cross-section
#             static/images/process/<name>.svg (tools/process-diagrams.py)
#   machines  slugs of the machines that do it (the Markdown file name
#             in content/machines/, without .md). Each becomes a link
#             to that machine's page on the docs site.
#   loop      true on the steps that repeat for every layer of the
#             chip. They are bracketed together on the flowchart.
#
# Add, remove or reorder steps here; nothing else needs to change.
# ==================================================================

- name: Clean
  text: "Every chip starts as a bare silicon wafer. Solvent baths and ultrasound strip off dust and oils so nothing gets trapped under the first layer."
  details: "Any particle left on the surface becomes a defect in every layer built on top of it. Organic films come off in solvents such as acetone and isopropyl alcohol; ultrasound shakes loose what sticks."
  machines: [ultrasonic-cleaner]

- name: Grow oxide
  text: "The wafer is heated to about 1000 °C with oxygen, growing a thin glassy layer of silicon dioxide that insulates and masks the silicon below."
  details: "Silicon reacts with oxygen at high temperature, so the oxide grows from the wafer itself rather than being laid on top. Thickness is set by temperature and time: a few hundred nanometres takes hours."
  machines: [tube-furnace]

- name: Coat
  text: "A few drops of light-sensitive photoresist are spun into a film a micron or two thick, then baked to drive off the solvent."
  details: "Spin speed sets the thickness: faster spinning gives a thinner film. A soft bake on the hot plate drives off the solvent so the resist is firm enough to expose."
  machines: [spinner, hot-plate]
  loop: true

- name: Expose
  text: "The layer's pattern is projected straight from the design file onto the resist. The stage lines each new layer up with the one before it."
  details: "Ultraviolet light changes the chemistry of the resist wherever it lands. Our maskless stepper projects the image from a screen, so a new design needs no new photomask."
  machines: [maskless-stepper, wafer-stage-alignment-firmware]
  loop: true

- name: Develop
  text: "A developer bath dissolves the exposed resist, leaving a stencil of the pattern on the wafer."
  details: "With positive resist the exposed areas dissolve and the rest stays. A hard bake afterwards toughens the stencil for the etch."
  machines: [developer, hot-plate]
  loop: true

- name: Inspect
  text: "A camera on a microscope measures the features and flags defects before the pattern is made permanent."
  details: "A camera and software measure line widths and look for defects. A bad pattern can still be stripped and redone here; after etching it cannot."
  machines: [computer-vision-metrology]
  loop: true

- name: Etch
  text: "Wherever the resist is open, a chemical bath dissolves the layer underneath, carving the pattern into the wafer."
  details: "Wet etching (for oxide, buffered hydrofluoric acid) is fast and cheap but eats sideways as well as down. Reactive ion etching in Gen Two cuts straight down for smaller features."
  machines: [wet-etch, reactive-ion-etcher]
  loop: true

- name: Strip
  text: "The resist has done its job and is removed, leaving a clean, patterned surface ready for the next step."
  details: "Solvents or an oxygen plasma remove the resist. What remains is the oxide with windows exactly where the design said."
  machines: [photoresist-stripper]
  loop: true

- name: Dope
  text: "A liquid dopant is spun on and driven into the exposed silicon in the furnace, creating the regions that make transistors work."
  details: "Atoms such as phosphorus or boron change how the silicon conducts. The oxide masks everywhere else, so doped regions form only under the windows; furnace heat drives them deeper."
  machines: [spin-on-doping, tube-furnace]

- name: Metallize
  text: "An argon plasma knocks metal atoms off a target and onto the wafer under vacuum. The metal is then patterned into wires the same way as every other layer."
  details: "In the sputterer, argon ions knock atoms off a metal target; they land on the wafer as a thin film. A final lithography and etch turns the film into wires and contact pads."
  machines: [sputterer, pvd-vacuum]

- name: Test
  text: "Fine needles touch down on the finished devices, right on the wafer, to measure whether each transistor and circuit works."
  details: "The probe station lowers fine needles onto the pads and measures current and voltage. The results show whether each step worked and what to change on the next run."
  machines: [probe-station, electron-microscope]
