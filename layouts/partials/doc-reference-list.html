{{/* The links inside one reference group. Split out so the "Other"
     bucket renders identically to the named ones. */}}
<ul class="border-t border-line">
  {{ range . }}
  <li class="py-4 border-b border-line">
    {{ if .url }}
    <a href="{{ .url }}"
       class="text-[1.0625rem] text-ink underline decoration-line underline-offset-4
              hover:text-maroon hover:decoration-maroon transition-colors">{{ .title }}</a>
    {{ else }}
    <span class="text-[1.0625rem] text-ink">{{ .title }}</span>
    {{ end }}
    {{ with .note }}<p class="text-[1.0625rem] text-muted mt-1.5 leading-snug">{{ . }}</p>{{ end }}
  </li>
  {{ end }}
</ul>
