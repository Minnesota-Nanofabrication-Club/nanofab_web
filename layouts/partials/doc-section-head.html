{{/* Heading for a machine-documentation section. Keeps the six
     sections on a rhythm: gold rule, label, optional right-hand
     summary. Call with (dict "id" "bom" "title" "Bill of materials"
     "meta" "9 parts"). */}}
<div class="flex flex-wrap items-baseline justify-between gap-3 mb-7">
  <div class="flex items-center gap-3">
    <span class="h-1 w-8 bg-gold rounded-full"></span>
    <h2 class="font-display font-semibold text-2xl tracking-tight">{{ .title }}</h2>
  </div>
  {{ with .meta }}<p class="font-mono text-xs text-faint">{{ . }}</p>{{ end }}
</div>
