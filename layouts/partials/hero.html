<section id="top" class="relative overflow-hidden border-b border-line">
  <div class="absolute inset-0 bg-grid pointer-events-none"></div>
  <div class="absolute inset-0 pointer-events-none flex items-center justify-end opacity-60">
    <svg viewBox="0 0 600 400" class="w-[72%] max-w-2xl" aria-hidden="true">
      <g fill="none" stroke="{{ .Site.Params.colors.maroon }}" stroke-width="1.5" stroke-linecap="round">
        <path class="circuit-path" d="M20 340 H180 V220 H320" />
        <path class="circuit-path" d="M60 60 V160 H240 V260 H420" style="animation-delay:.3s" />
        <path class="circuit-path" d="M480 40 V140 H340" style="animation-delay:.6s" />
        <path class="circuit-path" d="M540 300 H400 V180" style="animation-delay:.9s" />
      </g>
      <g fill="{{ .Site.Params.colors.gold }}" stroke="{{ .Site.Params.colors.maroon }}" stroke-width="1.5">
        <circle cx="320" cy="220" r="4.5" class="circuit-node" style="animation-delay:.5s" />
        <circle cx="420" cy="260" r="4.5" class="circuit-node" style="animation-delay:.8s" />
        <circle cx="340" cy="140" r="4.5" class="circuit-node" style="animation-delay:1.1s" />
        <circle cx="400" cy="180" r="4.5" class="circuit-node" style="animation-delay:1.4s" />
      </g>
    </svg>
  </div>

  <div class="relative mx-auto max-w-6xl px-6 pt-20 pb-24">
    <div class="inline-flex items-center gap-2.5 rounded-full border border-line bg-surface/80 px-3.5 py-1.5 text-xs text-muted mb-7">
      <span class="w-1.5 h-1.5 rounded-full bg-signal-green"></span>
      Student organization ·
      <a href="{{ .Site.Params.umn.universityURL }}" class="text-ink hover:text-maroon transition-colors">{{ .Site.Params.tagline }}</a>
    </div>

    <h1 class="font-display font-700 text-5xl sm:text-6xl lg:text-[4.25rem] leading-[1.03] tracking-tight max-w-3xl">
      {{ .Title }}
    </h1>
    {{/* Gold rule under the headline — a small, deliberate UMN cue. */}}
    <div class="mt-7 h-1 w-20 bg-gold rounded-full"></div>

    <p class="mt-7 max-w-xl text-lg text-muted leading-relaxed">
      {{ .Params.heroSubhead }}
    </p>

    <div class="mt-10 flex flex-wrap items-center gap-3">
      <a href="{{ .Site.Params.discordURL }}"
         class="inline-flex items-center gap-2 rounded-md bg-maroon text-white font-medium px-5 py-3 hover:bg-maroon-dark transition-colors">
        Join our Discord
      </a>

      <a href="{{ "/machines/" | relURL }}"
         class="inline-flex items-center gap-2 rounded-md border border-ink/25 bg-surface/60 px-5 py-3 font-medium hover:border-ink transition-colors">
        Explore the fab
        <span aria-hidden="true">→</span>
      </a>

      <a href="{{ .Site.Params.linkedinURL }}"
         aria-label="{{ .Site.Title }} on LinkedIn"
         class="inline-flex items-center justify-center w-11 h-11 rounded-md border border-line text-muted hover:border-ink hover:text-ink transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
      </a>
      <a href="{{ .Site.Params.instagramURL }}"
         aria-label="{{ .Site.Title }} on Instagram"
         class="inline-flex items-center justify-center w-11 h-11 rounded-md border border-line text-muted hover:border-ink hover:text-ink transition-colors">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.65-.07-4.85s.02-3.58.07-4.85c.15-3.23 1.67-4.77 4.92-4.92 1.27-.06 1.65-.07 4.85-.07zM12 0C8.74 0 8.33.01 7.05.07c-4.35.2-6.78 2.62-6.98 6.98C0 8.33 0 8.74 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98C8.33 24 8.74 24 12 24s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.2-4.35-2.62-6.78-6.98-6.98C15.67.01 15.26 0 12 0zm0 5.84A6.16 6.16 0 1 0 12 18.16 6.16 6.16 0 0 0 12 5.84zm0 10.16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.41-10.4a1.44 1.44 0 1 1-2.88 0 1.44 1.44 0 0 1 2.88 0z"/></svg>
      </a>

      <a href="mailto:{{ .Site.Params.contactEmail }}" class="text-sm text-muted hover:text-ink transition-colors underline underline-offset-4 ml-1">
        {{ .Site.Params.contactEmail }}
      </a>
    </div>
  </div>
</section>
